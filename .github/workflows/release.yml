name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Import certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profiles
        env:
          PROVISION_PROFILE_APP: ${{ secrets.PROVISION_PROFILE_APP }}
          PROVISION_PROFILE_QUICKLOOK: ${{ secrets.PROVISION_PROFILE_QUICKLOOK }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISION_PROFILE_APP" | base64 --decode \
            > "$PROFILES_DIR/Mud_Developer_ID.provisionprofile"
          echo "$PROVISION_PROFILE_QUICKLOOK" | base64 --decode \
            > "$PROFILES_DIR/Mud_QuickLook_Developer_ID.provisionprofile"

      - name: Derive version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          BUILD=$(xcrun agvtool what-version -terse)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Download Sparkle
        run: .github/scripts/update-sparkle

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Mud.xcodeproj \
            -scheme "Mud - Direct"

      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive \
            -project Mud.xcodeproj \
            -scheme "Mud - Direct" \
            -configuration Release-Direct \
            -archivePath "$RUNNER_TEMP/Mud.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            DEVELOPMENT_TEAM=XVL2AFNXH5 \
            MARKETING_VERSION="$VERSION"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mud.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist .github/ExportOptions.plist

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Mud" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Mud.app" 160 200 \
            --app-drop-link 440 200 \
            "$RUNNER_TEMP/Mud.dmg" \
            "$RUNNER_TEMP/export/Mud.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/Mud.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait --timeout 1200
          xcrun stapler staple "$RUNNER_TEMP/Mud.dmg"

      - name: Prepare release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp "$RUNNER_TEMP/Mud.dmg" "Mud-${TAG}.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "Mud-${TAG}.dmg" \
            --title "Mud ${VERSION}" \
            --generate-notes

      - name: Build and publish appcast and site
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WEBSITE_SSH_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          WEBSITE_SSH_USER: ${{ secrets.WEBSITE_SSH_USER }}
          WEBSITE_SSH_HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          DMG="Mud-${TAG}.dmg"

          # Write key files
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          echo "$WEBSITE_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          # Build appcast (single-item, no fetch needed)
          .github/scripts/build-appcast \
            "$DMG" "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/sparkle_key" \
            > appcast.xml

          # Publish appcast and release notes
          DEST="${WEBSITE_SSH_HOST}/mud"
          scp -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=no \
            appcast.xml \
            "${WEBSITE_SSH_USER}@${WEBSITE_SSH_HOST}:${DEST}/appcast.xml"
          scp -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=no \
            -r Site/releases/ \
            "${WEBSITE_SSH_USER}@${WEBSITE_SSH_HOST}:${DEST}/releases/"

          # Clean up
          rm -f "$RUNNER_TEMP/sparkle_key" "$RUNNER_TEMP/deploy_key"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
